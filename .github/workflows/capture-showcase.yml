name: Capture Arcade showcase

on:
  pull_request:
    paths:
      - '.github/workflows/capture-showcase.yml'
      - 'scripts/capture-screenshots.js'
      - 'public/**'
      - 'src/**'
      - 'lib/**'
      - 'server.js'
      - 'package*.json'
      - 'README.md'
      - 'docs/screenshot-capture.md'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Capture all nine actual experiences
        env:
          CHROME_BIN: google-chrome
        run: npm run screenshots
      - name: Check uniform showcase dimensions
        run: npm run screenshots:check
      - name: Save captures for visual review
        uses: actions/upload-artifact@v4
        with:
          name: arcade-showcase-${{ github.sha }}
          path: |
            public/screenshots/*.png
            public/screenshots/capture-manifest.json
            README.md
          if-no-files-found: error
          retention-days: 14
