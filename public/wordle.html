<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3efe5"><title>Many Words — a variable-length word game</title><link rel="stylesheet" href="/platform.css"><link rel="stylesheet" href="/wordle.css"></head>
<body><header><nav class="arcade-nav" aria-label="Arcade games"><a href="/" title="Drawing board">🖊️</a><a href="/tank" title="Tank">🚜</a><a href="/penalty" title="Penalty shootout">⚽</a><a href="/fighter" title="Line Fighter">👊</a><a href="/snake" title="Snake">🐍</a><a href="/bigtwo" title="Big-D">♦</a><a href="/typing" title="Type/Off">⌨️</a><a class="active" href="/wordle" title="Many Words" aria-current="page">W</a><a href="/poll" title="Quick Poll" aria-label="Quick Poll">▣</a></nav><div class="title"><small>SOLO WORD GAME</small><strong>MANY WORDS</strong></div><div id="connection">● CONNECTING</div><button id="reset">NEW WORD</button></header>
<main><section class="intro"><div><p class="eyebrow">NOT JUST FIVE LETTERS</p><h1>Guess the word<br><em>your length.</em></h1></div></section>
<section class="game" aria-label="Word guessing game"><div class="lengths"><span>WORD LENGTH</span><div role="group" aria-label="Choose word length"><button data-length="2">2</button><button data-length="3">3</button><button data-length="4">4</button><button data-length="5">5</button><button data-length="6">6</button><button data-length="7">7</button><button data-length="8">8</button></div><small id="lengthCount"></small></div><div id="board" aria-label="Guess grid"></div><p id="message" role="status" aria-live="polite"></p><form id="guessForm"><label for="guess">YOUR GUESS</label><div><input id="guess" name="guess" autocomplete="off" autocapitalize="characters" spellcheck="false" minlength="2" maxlength="8" aria-describedby="message"><button>ENTER ↵</button></div></form><div class="key"><span><i class="correct"></i>Right place</span><span><i class="present"></i>Wrong place</span><span><i class="absent"></i>Not in word</span></div></section>
<p class="solo-note">One private puzzle per player. No opponents, rankings, or shared board.</p></main><script src="/platform.js"></script><script src="/wordle.js"></script></body></html>
