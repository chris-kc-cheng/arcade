<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3efe5"><title>Many Words — a variable-length word game</title><link rel="stylesheet" href="/platform.css"><link rel="stylesheet" href="/wordle.css">
  <meta name="application-name" content="Arcade">
  <meta name="apple-mobile-web-app-title" content="Arcade">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body><header class="arcade-topbar" data-arcade-game="wordle"><button id="reset" type="button" disabled>NEW WORD</button></header>
<main><section class="intro"><div><p class="eyebrow">NOT JUST FIVE LETTERS</p><h1>Guess the word<br><em>your length.</em></h1></div></section>
<section class="game" aria-label="Word guessing game"><div class="lengths"><span>WORD LENGTH</span><div role="group" aria-label="Choose word length"><button data-length="2">2</button><button data-length="3">3</button><button data-length="4">4</button><button data-length="5">5</button><button data-length="6">6</button><button data-length="7">7</button><button data-length="8">8</button></div><small id="lengthCount"></small></div><div id="board" aria-label="Guess grid"></div><p id="message" role="status" aria-live="polite"></p><form id="guessForm"><label for="guess">YOUR GUESS</label><div><input id="guess" name="guess" autocomplete="off" autocapitalize="characters" spellcheck="false" minlength="2" maxlength="8" aria-describedby="message"><button>ENTER ↵</button></div></form><div id="keyboard" class="keyboard" aria-label="On-screen keyboard"></div><div class="key" aria-label="Letter hint legend"><span><i class="correct"></i>Right place</span><span><i class="present"></i>Wrong place</span><span><i class="absent"></i>Not in word</span></div></section>
<p class="solo-note">One private puzzle per player. No opponents, rankings, or shared board.</p></main><script src="/platform.js"></script><script src="/wordle.js"></script></body></html>
