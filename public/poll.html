<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff4df"><title>Quick Poll — Arcade</title><link rel="stylesheet" href="/platform.css"><link rel="stylesheet" href="/poll.css"></head>
<body><header><nav class="arcade-nav" aria-label="Arcade games"><a href="/" title="Drawing board">🖊️</a><a href="/tank" title="Tank">🚜</a><a href="/penalty" title="Penalty shootout">⚽</a><a href="/fighter" title="Line Fighter">👊</a><a href="/snake" title="Snake">🐍</a><a href="/bigtwo" title="Big-D">♦</a><a href="/typing" title="Type/Off">⌨️</a><a href="/wordle" title="Many Words">W</a><a class="active" href="/poll" title="Quick Poll" aria-current="page">▣</a></nav><a class="brand" href="/poll"><b>QUICK</b> POLL</a><div id="pollPresence" class="active-players" tabindex="0" aria-label="0 users connected"><strong>0</strong><span> CONNECTED</span><div class="active-player-details"><div>No connected users</div></div></div><span id="connection">● CONNECTING</span><button id="reset" hidden>RESET</button></header>
<main><section id="create" class="card"><p class="kicker">ASK THE ROOM</p><h1>Create a poll<br><em>in seconds.</em></h1><form id="createForm"><label>QUESTION<input name="question" maxlength="240" required placeholder="What should we do next?"></label><fieldset><legend>ANSWER CHOICES</legend><div id="choices"></div><button type="button" id="addChoice" class="secondary">＋ ADD A CHOICE</button></fieldset><button class="primary">CREATE POLL →</button></form></section>
<section id="poll" class="poll-layout" hidden><aside class="share"><p class="kicker">SCAN TO JOIN</p><div class="qr"><img id="qr" alt="QR code linking to this poll" width="320" height="320"></div><strong id="pollCode"></strong><button id="copy" class="secondary">COPY LINK</button></aside><section class="card vote"><p class="kicker" id="status">LIVE POLL</p><h1 id="question"></h1><form id="voteForm"><div id="answers"></div><button class="primary">SUBMIT ANSWER</button></form><div id="thanks" hidden><h2>Answer received!</h2><p>Your vote is in. Results appear when the poll starter shares them.</p></div><div id="results" hidden></div><button id="showResults" class="primary creator" hidden>SHOW RESULTS</button></section></section></main><p id="toast" role="status" aria-live="polite"></p><script src="/poll.js"></script></body></html>
