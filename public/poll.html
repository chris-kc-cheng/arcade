<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff4df"><title>Quick Poll — Arcade</title><link rel="stylesheet" href="/platform.css"><link rel="stylesheet" href="/poll.css">
  <meta name="application-name" content="Arcade">
  <meta name="apple-mobile-web-app-title" content="Arcade">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body><header class="arcade-topbar" data-arcade-game="poll"><button id="reset" type="button" disabled>RESET POLL</button></header>
<main><section id="create" class="card"><p class="kicker">ASK THE ROOM</p><h1>Create a poll<br><em>in seconds.</em></h1><form id="createForm"><label>QUESTION<input name="question" maxlength="240" required placeholder="What should we do next?"></label><fieldset><legend>ANSWER CHOICES</legend><div id="choices"></div><button type="button" id="addChoice" class="secondary">＋ ADD A CHOICE</button></fieldset><button class="primary">CREATE POLL →</button></form></section>
<section id="poll" class="poll-layout" hidden><aside class="share"><p class="kicker">SCAN TO JOIN</p><div class="qr"><img id="qr" alt="QR code linking to this poll" width="320" height="320"></div><strong id="pollCode"></strong><button id="copy" class="secondary">COPY LINK</button></aside><section class="card vote"><p class="kicker" id="status">LIVE POLL</p><p id="responseProgress" role="status" aria-live="polite">0 RESPONDED · 0 CONNECTED</p><h1 id="question"></h1><form id="voteForm"><div id="answers"></div><button class="primary">SUBMIT ANSWER</button></form><div id="thanks" hidden><h2>Answer received!</h2><p>Your vote is in. Results appear when the poll starter shares them.</p></div><div id="results" hidden></div><button id="showResults" class="primary creator" hidden>SHOW RESULTS</button></section></section></main><p id="toast" role="status" aria-live="polite"></p><script src="/platform.js"></script><script src="/poll.js"></script></body></html>
