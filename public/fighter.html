<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ede5d3"><title>Line Fighter</title>
  <link rel="stylesheet" href="/fighter.css">
  <link rel="stylesheet" href="/platform.css">
</head>
<body>
  <header>
    <nav class="arcade-nav" aria-label="Arcade games"><a href="/" title="Drawing board" aria-label="Drawing board">🖊️</a><a href="/tank" title="Tank" aria-label="Tank">🚜</a><a href="/penalty" title="Penalty shootout" aria-label="Penalty shootout">⚽</a><a class="active" href="/fighter" title="Line Fighter" aria-label="Line Fighter" aria-current="page">👊</a><a href="/snake" title="Snake" aria-label="Snake">🐍</a><a href="/bigtwo" title="Big-D" aria-label="Big-D">♦</a></nav>
    <div class="brand"><small>ARCADE PRESENTS</small><strong>LINE FIGHTER</strong></div>
    <form id="fighterName"><input maxlength="24" aria-label="Player name" placeholder="Player name"><button title="Save player name">✓</button></form>
    <div id="connection"><b></b><span>CONNECTING</span></div>
    <button id="reset" type="button">RESET MATCH</button>
  </header>
  <main>
    <section class="hud" aria-label="Fighter energy">
      <div class="fighter-label"><strong id="p1Name">Player</strong><span>PLAYER 1</span></div>
      <div class="energy"><i id="p1Energy"></i></div><div id="round" class="round">01</div>
      <div class="energy right"><i id="p2Energy"></i></div><div class="fighter-label right"><strong id="p2Name">CPU</strong><span>CPU</span></div>
    </section>
    <canvas id="arena" aria-label="Multiplayer stick fighter arena"></canvas>
    <div id="announcement" class="announcement" role="status"></div>
    <div id="combo" class="combo" aria-live="polite"></div>
    <aside id="spectator" class="spectator"><b>SPECTATING</b><span id="queue"></span></aside>
    <div class="controls"><span><kbd>W A S D</kbd> MOVE</span><span><kbd>J</kbd> PUNCH</span><span><kbd>K</kbd> KICK</span></div>
    <aside class="combo-guide" aria-label="Special move combinations"><b>SPECIAL MOVES</b><span>HADOKEN: ↓ + FRONT + J</span><span>SHORYUKEN: FRONT → ↓ → FRONT + J</span><span>TATSUMAKI: ↓ + BACK + K</span></aside>
  </main>
  <script src="/platform.js"></script>
  <script src="/fighter.js"></script>
</body>
</html>
