<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Snake</title><link rel="stylesheet" href="/snake.css"><link rel="stylesheet" href="/snake-multiplayer.css">
  <link rel="stylesheet" href="/platform.css">

  <meta name="application-name" content="Arcade">
  <meta name="apple-mobile-web-app-title" content="Arcade">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#141824">
</head>
<body>
  <header class="arcade-topbar" data-arcade-game="snake"><button id="resetButton" type="button" disabled>RESET MATCH</button></header>
  <main class="game-shell"><section class="console"><div class="screen-bezel"><div class="screen-header"><div><small>SCORE</small><strong id="score">0000</strong></div><div class="screen-title">SNAKE PARTY</div><div class="high-score"><small>HI-SCORE</small><strong id="highScore">0000</strong></div></div><div class="canvas-wrap"><canvas id="game" width="720" height="500" aria-label="Snake game"></canvas><div class="start-card" id="startCard"><p class="insert">★ READY PLAYER ONE ★</p><h2>CHASE THE<br><span>GLOW-BIT!</span></h2><p class="hint">DODGE THE CREW. GROW THE LONGEST.</p><button id="startButton">START GAME ▶</button></div><div class="pause-card" id="pauseCard" hidden><b>PAUSED</b><span>PRESS P TO CONTINUE</span></div></div><div class="screen-footer">ARROWS / WASD MOVE · P PAUSE · R RESTART</div></div><aside class="side-panel"><h3>LIVE ROSTER</h3><div id="roster" class="roster"></div><div class="mission"><span>CURRENT MISSION</span><strong>FIRST TO 25</strong><b id="missionProgress">0/25</b></div><button id="soundButton" type="button" aria-pressed="true">♪ SOUND: ON</button></aside></section></main>
  <script src="/platform.js"></script>
  <script src="/app.js"></script>
</body>
</html>
