<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Snake</title><link rel="stylesheet" href="/snake.css"><link rel="stylesheet" href="/snake-multiplayer.css">
  <link rel="stylesheet" href="/platform.css">
</head>
<body>
  <header class="snake-bar"><nav class="arcade-nav" aria-label="Arcade games"><a href="/" title="Drawing board" aria-label="Drawing board">🖊️</a><a href="/tank" title="Tank" aria-label="Tank">🚜</a><a href="/penalty" title="Penalty shootout" aria-label="Penalty shootout">⚽</a><a href="/fighter" title="Line Fighter" aria-label="Line Fighter">👊</a><a class="active" href="/snake" title="Snake" aria-label="Snake" aria-current="page">🐍</a><a href="/bigtwo" title="Big-D" aria-label="Big-D">♦</a><a href="/typing" class="back" title="Type/Off" aria-label="Type/Off">⌨️</a></nav><strong>SNAKE</strong><span>PIXEL ARCADE</span></header>
  <main class="game-shell"><section class="console"><div class="screen-bezel"><div class="screen-header"><div><small>SCORE</small><strong id="score">0000</strong></div><div class="screen-title">SNAKE PARTY</div><div class="high-score"><small>HI-SCORE</small><strong id="highScore">0000</strong></div></div><div class="canvas-wrap"><canvas id="game" width="720" height="500" aria-label="Snake game"></canvas><div class="start-card" id="startCard"><p class="insert">★ READY PLAYER ONE ★</p><h2>CHASE THE<br><span>GLOW-BIT!</span></h2><p class="hint">DODGE THE CREW. GROW THE LONGEST.</p><button id="startButton">START GAME ▶</button></div><div class="pause-card" id="pauseCard" hidden><b>PAUSED</b><span>PRESS P TO CONTINUE</span></div></div><div class="screen-footer">ARROWS / WASD MOVE · P PAUSE · R RESTART</div></div><aside class="side-panel"><h3>LIVE ROSTER</h3><div id="roster" class="roster"></div><div class="mission"><span>CURRENT MISSION</span><strong>FIRST TO 25</strong><b id="missionProgress">0/25</b></div><button id="resetButton" type="button">RESET MATCH</button><button id="soundButton" type="button" aria-pressed="true">♪ SOUND: ON</button></aside></section></main>
  <script src="/platform.js"></script>
  <script src="/app.js"></script>
</body>
</html>
