<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f2723"><meta name="application-name" content="Arcade"><meta name="apple-mobile-web-app-title" content="Arcade"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180"><title>Typo Hunt · Arcade</title><link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any"><link rel="stylesheet" href="/platform.css"><link rel="stylesheet" href="/typohunt.css"></head>
<body><header class="arcade-topbar" data-arcade-game="typohunt"><button id="reset" type="button" disabled>RESET RANKING ↻</button></header>
<main><section class="intro"><h1>Typo<span>Hunt</span></h1><aside class="scores" aria-label="Live ranking"><h2>LIVE RANKING <small id="spectators"></small></h2><ol id="players"></ol></aside></section>
<div class="levels" role="group" aria-label="Difficulty level"><span>LEVEL</span><button type="button" data-level="1" aria-pressed="false" aria-label="Level 1, one mistake, one short sentence">1</button><button type="button" data-level="2" aria-pressed="false" aria-label="Level 2, two mistakes">2</button><button type="button" data-level="3" aria-pressed="false" aria-label="Level 3, three mistakes">3</button><button type="button" data-level="4" aria-pressed="false" aria-label="Level 4, four mistakes">4</button><button type="button" data-level="5" aria-pressed="false" aria-label="Level 5, five mistakes in a longer paragraph">5</button></div>
<div class="meta"><strong id="time">1:30</strong><span id="found">0<small> / 0</small></span><span class="label">FOUND</span><div class="time-track"><i id="timebar"></i></div></div>
<div class="actions"><p id="status" role="status" aria-live="polite">Connecting…</p><button type="button" id="skip" class="action" hidden>SKIP · SHOW ANSWERS</button><button type="button" id="next" class="action primary" hidden>NEXT QUESTION →</button></div>
<section class="hunt" id="huntPane" aria-label="Passage"><div id="words" class="text" role="group" aria-label="Words to check. Choose a word that contains a spelling or grammar mistake."></div></section>
<section id="answers" class="answers" aria-label="Answers" hidden><h2>ANSWERS</h2><ul id="answerList"></ul></section>
<p class="footnote">Wrong guess −25 and a 1.5 s lockout · faster finds and higher levels score more · arrow keys move between words</p></main>
<script src="/sso.js"></script><script src="/platform.js"></script><script src="/typohunt.js"></script></body></html>
