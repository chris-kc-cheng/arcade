<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17152b"><title>Type/Off — Typing Race</title><link rel="stylesheet" href="/platform.css"><link rel="stylesheet" href="/typing.css">
  <meta name="application-name" content="Arcade">
  <meta name="apple-mobile-web-app-title" content="Arcade">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body><header class="arcade-topbar" data-arcade-game="typing"><button id="reset" type="button" disabled>RESET RACE</button></header>
<main><section class="setup" aria-label="Race settings"><div class="settings"><div><small>MODE</small><div class="levels" role="group" aria-label="Game mode"><button data-mode="solo">SOLO</button><button data-mode="versus">HEAD-TO-HEAD</button></div></div><div><small>DIFFICULTY</small><div class="levels" role="group" aria-label="Difficulty"><button data-level="easy">EASY</button><button data-level="medium">MEDIUM</button><button data-level="hard">HARD</button></div></div></div><p id="status" role="status" aria-live="polite">Waiting for two players</p></section>
<section class="opponent" aria-label="Opponent progress"><div class="lane-head"><span>OPPONENT</span><strong id="opponentName">Waiting…</strong><b id="opponentPercent">0%</b></div><div class="track"><i id="opponentProgress"></i></div><p id="opponentText">Invite another player to begin the race.</p></section>
<section class="you" aria-label="Your typing area"><div class="lane-head"><span>YOU · TYPE BELOW</span><strong id="youName">Player</strong><b id="youPercent">0%</b></div><div id="karaoke" class="karaoke" aria-hidden="true"></div><textarea id="typingInput" aria-label="Type the displayed passage" autocomplete="off" autocapitalize="off" spellcheck="false" disabled></textarea><p class="hint">Mistakes are <em>coral</em>. Backspace is allowed.</p></section></main>
<dialog id="results"><form method="dialog"><button class="close" aria-label="Close results">×</button></form><small>RACE COMPLETE</small><h2>THE FINAL TALLY</h2><table><thead><tr><th>STAT</th><th id="resultP1">PLAYER 1</th><th id="resultP2">PLAYER 2</th></tr></thead><tbody id="resultRows"></tbody></table><p>Score 100 represents a fast adult pace at perfect accuracy.</p><button id="raceAgain">RACE AGAIN</button></dialog>
<script src="/platform.js"></script><script src="/typing.js"></script></body></html>
