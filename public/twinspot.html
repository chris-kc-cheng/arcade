<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f2723"><meta name="application-name" content="Arcade"><meta name="apple-mobile-web-app-title" content="Arcade"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180"><title>Twin Spot · Arcade</title><link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any"><link rel="stylesheet" href="/platform.css"><link rel="stylesheet" href="/twinspot.css"></head>
<body><header class="arcade-topbar" data-arcade-game="twinspot"><button id="reset" type="button" disabled>RESET RANKING ↻</button></header>
<main><section class="intro"><h1>Twin<span>Spot</span></h1><aside class="scores" aria-label="Live ranking"><h2>LIVE RANKING <small id="spectators"></small></h2><ol id="players"></ol></aside></section>
<div class="levels" role="group" aria-label="Difficulty"><span>LEVEL</span><button type="button" data-level="easy" aria-pressed="false" aria-label="Easy, five emoji per card">EASY</button><button type="button" data-level="medium" aria-pressed="false" aria-label="Medium, seven emoji per card">MEDIUM</button><button type="button" data-level="hard" aria-pressed="false" aria-label="Hard, seven symbols per card, about half shown as words">HARD</button></div>
<div class="actions"><p id="status" role="status" aria-live="polite">Connecting…</p><button type="button" id="skip" class="action" hidden>SKIP · SHOW MATCH</button></div>
<section class="cards" aria-label="Two cards. Exactly one symbol appears on both."><div class="card" id="card0" role="group" aria-label="Left card"></div><div class="card" id="card1" role="group" aria-label="Right card"></div></section>
<p class="footnote">Click the one symbol, or its word, that appears on both cards · wrong click −25 and a 1 s lockout · faster finds and harder levels score more</p></main>
<script src="/sso.js"></script><script src="/platform.js"></script><script src="/twinspot.js"></script></body></html>
