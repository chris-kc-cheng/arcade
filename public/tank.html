<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111712">
  <title>Iron Grid</title>
  <link rel="stylesheet" href="/tank.css">
  <link rel="stylesheet" href="/platform.css">

  <meta name="application-name" content="Arcade">
  <meta name="apple-mobile-web-app-title" content="Arcade">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
  <canvas id="game" aria-label="3D multiplayer tank arena"></canvas>
  <header class="arcade-topbar" data-arcade-game="tank"><button id="reset" type="button" disabled>RESET MATCH</button></header>
  <section class="scoreboard" aria-label="Scoreboard">
    <div class="score-head"><span>PILOT</span><span>KILLS</span></div>
    <div id="scores"></div>
  </section>
  <aside class="map-panel" aria-label="Tactical map">
    <div class="map-head"><span>TACTICAL MAP</span><b>240 × 240</b></div>
    <canvas id="minimap" width="420" height="420" aria-label="Map showing every tank and obstacle"></canvas>
    <div class="map-key"><span><i class="key-you"></i>YOU</span><span><i class="key-tank"></i>TANKS</span><span><i class="key-cover"></i>COVER</span></div>
  </aside>
  <div class="reticle" aria-hidden="true"><i></i></div>
  <div class="controls"><span><kbd>WASD</kbd> DRIVE</span><span><kbd>MOUSE</kbd> AIM</span><span><kbd>CLICK</kbd> FIRE</span></div>
  <div id="respawn" class="respawn" role="status"><strong>DESTROYED</strong><span>REDEPLOYING IN <b>3</b></span></div>
  <div id="message" class="message" role="status"></div>
  <script src="/platform.js"></script>
  <script src="/tank.js"></script>
</body>
</html>
