<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111712">
  <title>Iron Grid</title>
  <link rel="stylesheet" href="/tank.css">
</head>
<body>
  <canvas id="game" aria-label="3D multiplayer tank arena"></canvas>
  <header class="game-bar">
    <nav class="arcade-nav" aria-label="Arcade games"><a href="/" class="back" aria-label="Drawing board" title="Drawing board">🖊️</a><a href="/tank" class="back active" aria-label="Tank" title="Tank" aria-current="page">🚜</a><a href="/penalty" class="back" aria-label="Penalty shootout" title="Penalty shootout">⚽</a><a href="/fighter" class="back" aria-label="Line Fighter" title="Line Fighter">👊</a><a href="/snake" class="back" aria-label="Snake" title="Snake">🐍</a><a href="/bigtwo" class="back" aria-label="Big-D" title="Big-D">♦</a><a href="/typing" class="back" title="Type/Off" aria-label="Type/Off">⌨️</a><a href="/wordle" title="Many Words" aria-label="Many Words">W</a></nav>
    <div class="title"><span>IRON</span><strong>GRID</strong></div>
    <div id="connection" class="connection"><i></i><span>CONNECTING</span></div>
  </header>
  <section class="scoreboard" aria-label="Scoreboard">
    <div class="score-head"><span>PILOT</span><span>KILLS</span></div>
    <div id="scores"></div>
  </section>
  <aside class="map-panel" aria-label="Tactical map">
    <div class="map-head"><span>TACTICAL MAP</span><b>240 × 240</b></div>
    <canvas id="minimap" width="420" height="420" aria-label="Map showing every tank and obstacle"></canvas>
    <div class="map-key"><span><i class="key-you"></i>YOU</span><span><i class="key-tank"></i>TANKS</span><span><i class="key-cover"></i>COVER</span></div>
  </aside>
  <div class="reticle" aria-hidden="true"><i></i></div>
  <div class="controls"><span><kbd>WASD</kbd> DRIVE</span><span><kbd>MOUSE</kbd> AIM</span><span><kbd>CLICK</kbd> FIRE</span></div>
  <div id="respawn" class="respawn" role="status"><strong>DESTROYED</strong><span>REDEPLOYING IN <b>3</b></span></div>
  <div id="message" class="message" role="status"></div>
  <script src="/tank.js"></script>
</body>
</html>
