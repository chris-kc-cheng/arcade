<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f2723"><meta name="application-name" content="Arcade"><meta name="apple-mobile-web-app-title" content="Arcade"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180"><title>Flight Sim · Arcade</title><link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any"><link rel="stylesheet" href="/platform.css"><link rel="stylesheet" href="/flight.css"></head>
<body><header class="arcade-topbar" data-arcade-game="flight"><button id="reset" type="button" disabled>RESPAWN ↻</button></header>
<main class="stage" id="stage"><canvas id="view" aria-label="3D view from the plane. Fly with the keyboard." tabindex="0"></canvas><canvas id="hud" aria-hidden="true"></canvas>
<section class="toolbar" aria-label="Flight controls">
<select id="mode" aria-label="Flight mode" title="Flight mode"><option value="plane">Cessna 172</option><option value="airbus">Airbus A320</option><option value="jet">Jet (stunts)</option><option value="drone">Drone (no crash)</option></select>
<input id="airport" type="text" list="airportList" maxlength="40" size="14" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Airport" aria-label="Airport: a code (3 letter IATA or 4 letter ICAO) or a name, then press Enter" title="Type an airport code (YTZ, CYTZ) or name (Heathrow) and press Enter"><datalist id="airportList"></datalist>
<div class="group" role="group" aria-label="Simulation speed"><button type="button" data-scale="1" aria-pressed="true">1×</button><button type="button" data-scale="2" aria-pressed="false">2×</button><button type="button" data-scale="5" aria-pressed="false">5×</button><button type="button" data-scale="10" aria-pressed="false">10×</button><button type="button" data-scale="50" aria-pressed="false">50×</button><button type="button" data-scale="100" aria-pressed="false">100×</button></div>
<label class="group throttle"><span class="label">THR</span><input id="throttle" type="range" min="0" max="100" value="17" aria-label="Throttle"><output id="throttleValue">17%</output></label>
<div class="group" id="flapsGroup" role="group" aria-label="Flaps"><span class="label">FLAPS</span><button type="button" id="flapsUp" aria-label="Retract flaps one notch (V)">−</button><output id="flapsValue" aria-live="polite">0°</output><button type="button" id="flapsDown" aria-label="Extend flaps one notch (F)">+</button></div>
<div class="group"><button type="button" id="camera" aria-pressed="false">Camera</button><button type="button" id="help" aria-pressed="false">Keys</button><a class="credit" id="source" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer" aria-label="OpenStreetMap copyright">© OSM</a></div>
</section>
<section id="assist" class="assist" hidden aria-label="Approach assist"><h2>Approach assist <span id="assistPhase"></span></h2><dl id="assistRows"></dl><p id="assistNote"></p><label><input type="checkbox" id="autoThrottle"> Auto throttle</label><label><input type="checkbox" id="autoFlaps"> Auto flaps</label></section>
<section class="minimap" aria-label="Map"><canvas id="map" role="img" aria-label="Map of your plane and the other planes, north up"></canvas><div class="zoom"><button type="button" id="zoomIn" aria-label="Zoom map in">+</button><button type="button" id="zoomOut" aria-label="Zoom map out">−</button></div></section>
<section id="keys" class="keys" hidden aria-label="Keyboard controls"><dl id="keyList"></dl></section>
<div id="loading" class="overlay" role="status" aria-live="polite"><div><h1>Flight<span>Sim</span></h1><p id="loadingText">Reading OpenStreetMap…</p><i class="bar"><b id="loadingBar"></b></i></div></div>
<section id="results" class="results" hidden aria-label="Airports found"><ul id="resultList" role="listbox"></ul></section>
<div id="toast" class="toast" role="alert" hidden></div>
<div id="crash" class="overlay crash" hidden><div><h2>CRASHED</h2><p id="crashText"></p><p id="crashCount" role="status"></p><button type="button" id="again">Start over on final approach (R)</button></div></div>
</main>
<script src="/sso.js"></script><script src="/platform.js"></script><script src="/flight-physics.js"></script><script src="/flight-osm.js"></script><script src="/flight-models.js"></script><script src="/flight-render.js"></script><script src="/flight.js"></script></body></html>
