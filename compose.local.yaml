services:
  arcade:
    build:
      target: development
    image: arcade:dev
    command: npm run dev
    environment:
      NODE_ENV: development
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - arcade_node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  arcade_node_modules:
